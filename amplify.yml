# AWS Amplify Hosting build specification.
#
# This is a plain static site: no bundler, no dependencies, nothing to compile.
# The build phase only verifies that the text data is still internally consistent
# (every word gloss lines up with its Devanagari token), then publishes the
# repository root as-is.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - node --version
    build:
      commands:
        - node tools/validate.mjs
  artifacts:
    baseDirectory: /
    files:
      - index.html
      - assets/**/*
      - '*.mp3'
  cache:
    paths: []
customHeaders:
  - pattern: '**/*.mp3'
    headers:
      - key: Cache-Control
        value: 'public, max-age=31536000, immutable'
      - key: Accept-Ranges
        value: bytes
  - pattern: '/assets/**'
    headers:
      - key: Cache-Control
        value: 'public, max-age=604800'
  - pattern: '/index.html'
    headers:
      - key: Cache-Control
        value: 'public, max-age=0, must-revalidate'
